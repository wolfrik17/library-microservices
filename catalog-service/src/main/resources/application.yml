server:
  port: 8082

spring:
  application:
    name: catalog-service
  config:
    import: "optional:configserver:http://localhost:8888"

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true