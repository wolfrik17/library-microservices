<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="http://localhost:8080/">📚 Central Library</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="http://localhost:8080/books">Catalog</a></li>
                <li class="nav-item"><a class="nav-link" href="http://localhost:8080/loans">Lending Desk</a></li>
                <li class="nav-item"><a class="nav-link" href="http://localhost:8080/users">Users</a></li>
            </ul>
            <div class="d-flex">
                <a href="http://localhost:8080/login?logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2>Library Catalog</h2>
    <hr>

    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Add New Book</h5>
            <form th:action="@{/books}" th:object="${newBook}" method="post" class="row g-3">
                <div class="col-md-5">
                    <input type="text" th:field="*{title}" class="form-control" placeholder="Book Title" required>
                    <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger small"></span>
                </div>
                <div class="col-md-5">
                    <input type="text" th:field="*{isbn}" class="form-control" placeholder="ISBN (10-13 chars)" required>
                    <span th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}" class="text-danger small"></span>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Add Book</button>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-striped table-hover bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>ISBN</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.isbn}"></td>
            <td>
                <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
        <div>
            Total Books: [[${totalItems}]]
        </div>
        <div>
            <span th:each="i: ${#numbers.sequence(1, totalPages)}">
                <a th:if="${currentPage != i}" th:href="@{'/books?pageNo=' + ${i} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" class="btn btn-sm btn-outline-primary">[[${i}]]</a>
                <span th:unless="${currentPage != i}" class="btn btn-sm btn-primary">[[${i}]]</span>
            </span>
        </div>
        <div>
            Sort by:
            <a th:href="@{'/books?pageNo=' + ${currentPage} + '&sortField=title&sortDir=' + ${reverseSortDir}}" class="text-decoration-none">Title</a> |
            <a th:href="@{'/books?pageNo=' + ${currentPage} + '&sortField=isbn&sortDir=' + ${reverseSortDir}}" class="text-decoration-none">ISBN</a>
        </div>
    </div>

</div>
</body>
</html>
