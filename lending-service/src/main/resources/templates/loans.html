<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lending Desk</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .portal-header { background: #2c3e50; padding: 15px; text-align: right; }
        .portal-header a { color: white; text-decoration: none; font-weight: bold; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #34495e; }
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #2ecc71; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #27ae60; }
        .alert-error { background-color: #e74c3c; color: white; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
        .alert-success { background-color: #2ecc71; color: white; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-danger:hover { background-color: #c0392b; }
    </style>
</head>
<body>

<div class="portal-header">
    <a href="http://localhost:8080/">🏠 Back to Portal</a>
</div>

<div class="container">
    <h2>📚 Lending Desk Operations</h2>

    <div class="alert-error" th:if="${errorMessage != null and not #strings.isEmpty(errorMessage)}" th:text="${errorMessage}">
    </div>

    <div class="alert-success" th:if="${successMessage != null and not #strings.isEmpty(successMessage)}" th:text="${successMessage}">
    </div>

    <div class="card">
        <h3>Issue a New Loan</h3>
        <form th:action="@{/loans}" method="POST">
            <div class="form-group">
                <label for="userId">User ID:</label>
                <input type="number" id="userId" name="userId" placeholder="Enter Member's User ID" required>
            </div>
            <div class="form-group">
                <label for="bookId">Book ID:</label>
                <input type="number" id="bookId" name="bookId" placeholder="Enter Catalog Book ID" required>
            </div>
            <button type="submit" class="btn">Confirm Loan Checkout</button>
        </form>
    </div>

    <div class="card">
        <h3>Active System Loans</h3>
        <table>
            <thead>
            <tr>
                <th>Loan ID</th>
                <th>User ID</th>
                <th>Book ID</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="loan : ${loans}">
                <td th:text="${loan.id}">1</td>
                <td th:text="${loan.userId}">101</td>
                <td th:text="${loan.bookId}">502</td>
                <td>
                    <form th:action="@{/loans/{id}/return(id=${loan.id})}" method="POST" style="margin: 0;">
                        <button type="submit" class="btn-danger">Return Book</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
