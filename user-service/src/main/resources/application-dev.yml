server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/library_user_db
    username: postgres
    password: password # Change this to your local Postgres password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect