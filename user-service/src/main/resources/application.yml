spring:
  profiles:
    active: dev
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888" # Connects to vault
  cloud:
    config:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: refresh # Required for dynamic refresh

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true