<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="http://localhost:8080/">📚 Central Library</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="http://localhost:8080/books">Catalog</a></li>
                <li class="nav-item"><a class="nav-link" href="http://localhost:8080/loans">Lending Desk</a></li>
                <li class="nav-item"><a class="nav-link" href="http://localhost:8080/users">Users</a></li>
            </ul>
            <div class="d-flex">
                <a href="http://localhost:8080/login?logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2>User Management</h2>
    <div sec:authorize="hasRole('ADMIN')" class="alert alert-warning border-warning shadow-sm mt-3">
        🛡️ <strong>Admin Privilege Active:</strong> You have elevated rights to view and manage all system identities.
    </div>
    <hr>
    <table class="table table-striped bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>
        </tr>
        </tbody>
    </table>

    <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
        <div>Total Users: [[${totalItems}]]</div>
        <div>
            <span th:each="i: ${#numbers.sequence(1, totalPages)}">
                <a th:if="${currentPage != i}" th:href="@{'/users?pageNo=' + ${i} + '&sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}" class="btn btn-sm btn-outline-primary">[[${i}]]</a>
                <span th:unless="${currentPage != i}" class="btn btn-sm btn-primary">[[${i}]]</span>
            </span>
        </div>
        <div>
            Sort by:
            <a th:href="@{'/users?pageNo=' + ${currentPage} + '&sortField=username&sortDir=' + ${reverseSortDir}}" class="text-decoration-none">Username</a> |
            <a th:href="@{'/users?pageNo=' + ${currentPage} + '&sortField=role&sortDir=' + ${reverseSortDir}}" class="text-decoration-none">Role</a>
        </div>
    </div>
</div>
</body>
</html>
